<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Pencilwise</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pencilwise">
<meta name="theme-color" content="#111B33">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <section id="v-profiles" class="view" hidden></section>
  <section id="v-home" class="view" hidden>
    <nav class="rail" id="rail"></nav>
    <main class="main" id="main"></main>
  </section>
  <section id="v-draw" class="view" hidden>
    <header class="bar" id="bar"></header>
    <div class="desk">
      <aside class="dock" id="dock"></aside>
      <div class="stage" id="stage">
        <div class="sheet" id="sheet"><canvas class="ref" id="ref" width="300" height="225" hidden></canvas></div>
      </div>
    </div>
  </section>
  <section id="v-quiz" class="view" hidden></section>
  <div id="overlay" class="overlay" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <input type="file" id="restorein" accept=".json,application/json,text/plain" hidden>
</div>
<script src="js/lessons.js"></script>
<script src="js/bible.js"></script>
<script src="js/engine.js"></script>
<script src="js/app.js"></script>
<script src="js/quiz-data.js"></script>
<script src="js/quiz-more.js"></script>
<script src="js/quiz.js"></script>
<script src="js/live.js"></script>
</body>
</html>
